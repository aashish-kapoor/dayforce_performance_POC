name: Setup Load Test Data

on:
  workflow_dispatch:
    inputs:
      run_data_setup:
        description: 'Run data setup? (uncheck to skip entirely)'
        type: boolean
        default: true
      record_count:
        description: 'Number of records to generate'
        type: string
        default: '100'

permissions:
  id-token: write
  contents: read

jobs:
  setup-data:
    name: Generate data via JMeter and upload to Blob Storage
    runs-on: ubuntu-latest
    if: ${{ inputs.run_data_setup == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JMeter
        run: |
          wget -q https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Run JMeter data generation
        run: |
          mkdir -p output
          jmeter -n \
            -t dbsetup/data-generation.jmx \
            -Jrecord_count=${{ inputs.record_count }} \
            -Jcsv_output_path=output/random_numbers.csv \
            -Jinflux_host=${{ secrets.INFLUXDB_HOST }} \
            -Jinflux_org=${{ secrets.INFLUXDB_ORG }} \
            -Jinflux_bucket=${{ secrets.INFLUXDB_BUCKET }} \
            -Jinflux_token=${{ secrets.INFLUXDB_TOKEN }} \
            -l results/data-gen-results.jtl

      - name: Verify CSV was created
        run: |
          if [ ! -s output/random_numbers.csv ]; then
            echo "CSV file is missing or empty — failing job"
            exit 1
          fi
          echo "CSV row count: $(wc -l < output/random_numbers.csv)"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload CSV to Azure Blob Storage
        run: |
          az storage blob upload \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT }} \
            --container-name loadtest-data \
            --name random_numbers.csv \
            --file output/random_numbers.csv \
            --auth-mode login \
            --overwrite